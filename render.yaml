services:
  - type: web
    name: studyos-backend
    env: node
    plan: free
    buildCommand: npm --prefix server install && npm --prefix server run build
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CLIENT_URL
        value: https://*.vercel.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DIAGNOSTIC_KEY
        generateValue: true
